# Umbrales y configuración para la capa forense

metadata:
  suspicious_producers:
    - "Photoshop"
    - "GIMP"
    - "Illustrator"
    - "iLovePDF"
    - "Sejda"
    - "PDFescape"
    - "Canva"
  weights:
    metadata: 0.9

ela:
  z_score_threshold: 8.0
  area_threshold_pct: 0.05
  weights:
    ela: 0.6

copy_move:
  dbscan_eps: 8
  dbscan_min_samples: 6
  ratio_test: 0.75
  weights:
    copy_move: 0.7

noise:
  z_score_threshold: 8.0
  area_threshold_pct: 0.05
  weights:
    noise: 0.5

typography:
  chi2_threshold_995: 35.0  # Calibrated for BPCER < 5%
  weights:
    typography: 0.85

scorer:
  auto_approve_threshold: 0.25
  requires_review_risk_threshold: 0.60
