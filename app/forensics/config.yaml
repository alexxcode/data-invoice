# Umbrales y configuración para la capa forense

metadata:
  suspicious_producers:
    - "Photoshop"
    - "GIMP"
    - "Illustrator"
    - "iLovePDF"
    - "Sejda"
    - "PDFescape"
    - "Canva"
  weights:
    metadata: 0.9

ela:
  z_score_threshold: 4.5
  area_threshold_pct: 0.02
  weights:
    ela: 0.8

copy_move:
  dbscan_eps: 20
  dbscan_min_samples: 4
  ratio_test: 0.95
  weights:
    copy_move: 0.7

noise:
  z_score_threshold: 1.0
  area_threshold_pct: 0.001
  weights:
    noise: 0.5

typography:
  chi2_threshold_995: 18.0
  weights:
    typography: 0.85

scorer:
  auto_approve_threshold: 0.25
  requires_review_risk_threshold: 0.60
